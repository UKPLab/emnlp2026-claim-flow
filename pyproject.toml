[project]
name = "hypoflow"
version = "0.1.0"
description = "NLP Hypothesis Evolution = Contradictory, Supporting, and Neutral Hypothesis Flow Detection"
authors = [{ name = "Aniket Pramanick" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "acl-anthology>=0.5.3",
    "bibtexparser>=1.4.3",
    "duckdb>=1.4.1",
    "httpx[http2]>=0.28.1",
    "langchain>=0.3.8",
    "langchain-community>=0.3.7",
    "networkx>=3.4.2",
    "orjson>=3.11.3",
    "polars>=1.35.1",
    "pyarrow>=22.0.0",
    "PyMuPDF>=1.24.10",
    "rapidfuzz>=3.14.3",
    "rich>=14.2.0",
    "setuptools-rust>=1.10.1",
    "easyocr>=1.7.2",
    "docling>=2.64.0",
    "langchain-openai>=1.1.0",
    "matplotlib>=3.10.8",
]

[project.scripts]
get_meta = "scripts.get_meta:main"
# get_bib = "scripts.get_bib:main"
get_papers = "scripts.get_papers:main"
parse_papers = "scripts.parse_papers:main"
get_claims = "scripts.get_hypotheses:main"
get_citations = "scripts.get_citations:main"

[tool.setuptools.packages.find]
include = ["hypoflow*", "scripts*"]

[tool.uv]
dev-dependencies = [
    "pytest",
    "ruff",
    "mypy",
    "pandas",
    "tqdm",
    "requests",
    "pyyaml",
    "setuptools>=80.9.0",
]
no-build-isolation = true
cache-dir = ".uv-cache"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
